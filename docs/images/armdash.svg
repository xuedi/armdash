<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>armdash</title>
  <!-- the dashboard it holds up: the project's chart mark -->
  <rect x="132" y="16" width="112" height="84" rx="14" fill="#ffffff" stroke="#241f31" stroke-width="6"/>
  <path d="M132 30a14 14 0 0 1 14-14h84a14 14 0 0 1 14 14v10H132z" fill="#485fc7" stroke="#241f31" stroke-width="6" stroke-linejoin="round"/>
  <circle cx="226" cy="28" r="4" fill="#ffffff"/>
  <circle cx="213" cy="28" r="4" fill="#ffffff"/>
  <path d="M148 58h82M148 74h82" stroke="#e5e9f8" stroke-width="3"/>
  <path d="M150 88l22-20 18 12 34-28" fill="none" stroke="#485fc7" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="224" cy="52" r="6" fill="#26a269" stroke="#241f31" stroke-width="3"/>
  <!-- sparks -->
  <path d="M122 32l-12-6M120 50l-14 2M128 18l-4-10" stroke="#f6d32d" stroke-width="5" stroke-linecap="round"/>
  <!-- legs -->
  <g stroke="#241f31" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M72 212l-4 22M118 212l4 22"/>
  </g>
  <ellipse cx="62" cy="238" rx="13" ry="7" fill="#241f31"/>
  <ellipse cx="128" cy="238" rx="13" ry="7" fill="#241f31"/>
  <!-- arm holding the dashboard -->
  <path d="M150 148c16-10 22-26 24-48" fill="none" stroke="#241f31" stroke-width="20" stroke-linecap="round"/>
  <path d="M150 148c16-10 22-26 24-48" fill="none" stroke="#485fc7" stroke-width="10" stroke-linecap="round"/>
  <circle cx="175" cy="100" r="12" fill="#485fc7" stroke="#241f31" stroke-width="5"/>
  <!-- waving arm -->
  <path d="M40 160c-14-6-22-18-24-34" fill="none" stroke="#241f31" stroke-width="20" stroke-linecap="round"/>
  <path d="M40 160c-14-6-22-18-24-34" fill="none" stroke="#485fc7" stroke-width="10" stroke-linecap="round"/>
  <circle cx="16" cy="122" r="12" fill="#485fc7" stroke="#241f31" stroke-width="5"/>
  <!-- the board -->
  <rect x="32" y="112" width="128" height="102" rx="16" fill="#485fc7" stroke="#241f31" stroke-width="6"/>
  <path d="M46 128c10-6 24-8 40-8" fill="none" stroke="#8fa0e6" stroke-width="5" stroke-linecap="round"/>
  <!-- GPIO header, its hair -->
  <rect x="50" y="98" width="92" height="16" rx="4" fill="#241f31"/>
  <g fill="#f6d32d">
    <circle cx="60" cy="106" r="3"/><circle cx="72" cy="106" r="3"/><circle cx="84" cy="106" r="3"/>
    <circle cx="96" cy="106" r="3"/><circle cx="108" cy="106" r="3"/><circle cx="120" cy="106" r="3"/>
    <circle cx="132" cy="106" r="3"/>
  </g>
  <!-- mounting holes and the power LED -->
  <circle cx="46" cy="200" r="5" fill="#c9d1f2" stroke="#241f31" stroke-width="3"/>
  <circle cx="146" cy="200" r="5" fill="#c9d1f2" stroke="#241f31" stroke-width="3"/>
  <circle cx="144" cy="130" r="5" fill="#57e389" stroke="#241f31" stroke-width="3"/>
  <!-- face, looking up at its chart -->
  <circle cx="76" cy="154" r="14" fill="#ffffff" stroke="#241f31" stroke-width="5"/>
  <circle cx="116" cy="154" r="14" fill="#ffffff" stroke="#241f31" stroke-width="5"/>
  <circle cx="81" cy="149" r="5.5" fill="#241f31"/>
  <circle cx="121" cy="149" r="5.5" fill="#241f31"/>
  <ellipse cx="62" cy="180" rx="8" ry="5" fill="#f5a3c0" opacity="0.8"/>
  <ellipse cx="130" cy="180" rx="8" ry="5" fill="#f5a3c0" opacity="0.8"/>
  <path d="M86 180c6 7 16 7 22 0" fill="none" stroke="#241f31" stroke-width="5" stroke-linecap="round"/>
</svg>
