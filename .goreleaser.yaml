# GoReleaser builds the binary, the archives and every distro package from one
# config. The in-binary version lives in internal/version/version.go, and CI's
# release job makes the tag from that file, so the two cannot disagree. Nothing
# is stamped in at link time, so a tarball built here and a `go build` on a
# laptop report the same version.
version: 2

project_name: armdash

builds:
  - id: armdash
    main: ./cmd/armdash
    binary: armdash
    env:
      # Pure Go, no cgo, so no target needs a cross toolchain and the binary
      # runs on any glibc or musl system.
      - CGO_ENABLED=0
    goos:
      - linux
      - freebsd
      - darwin
    goarch:
      - amd64
      - arm64
      - arm
      - riscv64
    # 32-bit Raspberry Pi OS and older boards. v7 packages as armhf, the
    # architecture those systems install.
    goarm:
      - "7"
    ignore:
      - goos: freebsd
        goarch: arm
      - goos: freebsd
        goarch: riscv64
      - goos: darwin
        goarch: arm
      - goos: darwin
        goarch: riscv64
    ldflags:
      - -s -w
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: armdash
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}"
    files:
      - README.md
      - LICENSE
      - .env.dist
      - packaging/systemd/armdash.service
      - packaging/prometheus/prometheus.yml

nfpms:
  - id: armdash
    package_name: armdash
    vendor: armdash
    homepage: https://github.com/xuedi/armdash
    maintainer: Daniel Koch <xuedi@beijingcode.org>
    description: A single-binary dashboard for a home server, reading everything from Prometheus.
    license: EUPL-1.2
    formats:
      - deb
      - rpm
      - archlinux
    bindir: /usr/bin
    contents:
      - src: packaging/systemd/armdash.service
        dst: /usr/lib/systemd/system/armdash.service
      # Seeded into /etc by the post-install, which never overwrites an existing
      # file. Shipping it straight to /etc would let an upgrade clobber the
      # credentials.
      - src: packaging/armdash.env
        dst: /usr/share/armdash/armdash.env.example
      # For copying. Nothing edits the configuration Prometheus ships with.
      - src: packaging/prometheus/prometheus.yml
        dst: /usr/share/armdash/prometheus.yml.example
    scripts:
      postinstall: packaging/nfpm/postinstall.sh
    archlinux:
      scripts:
        postupgrade: packaging/nfpm/postupgrade.sh
    # A dashboard with no Prometheus to read shows empty charts, so the packages
    # bring Prometheus and node_exporter. apt and dnf install recommends by
    # default and let someone with Prometheus on another host skip them. nfpm
    # writes no recommends for Arch, so there it is a hard dependency or none.
    overrides:
      deb:
        recommends:
          - prometheus
          - prometheus-node-exporter
      rpm:
        recommends:
          - prometheus
          - node-exporter
      archlinux:
        dependencies:
          - prometheus
          - prometheus-node-exporter
checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: xuedi
    name: armdash
