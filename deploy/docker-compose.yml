# A Compose stack for hosts where containers are preferred over the packages.
# A .env next to this file is read too, see ../.env.dist; it may stay empty,
# the rest is set up on the settings page and kept in the data volume.
#
# There is no FRITZ!Box exporter here: armdash polls the box itself and
# publishes /metrics, so the credentials live in exactly one place.
name: armdash

services:
  armdash:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: armdash
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AD_CORE_PROMETHEUS_URL: http://prometheus:9090
      AD_CORE_DATA_DIR: /var/lib/armdash
    volumes:
      # Uploaded floor plans and device positions.
      - ./data/armdash:/var/lib/armdash
    ports:
      # Port 80 is a mapping, not a privilege: the process listens on 8080
      # inside the container and never needs root or CAP_NET_BIND_SERVICE.
      - "80:8080"
    depends_on:
      - prometheus
    networks:
      - dash

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: armdash-prometheus
    restart: unless-stopped
    user: "65534:65534"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # The default is 15d. This project exists to keep data indefinitely.
      - --storage.tsdb.retention.time=10y
      - --web.listen-address=0.0.0.0:9090
      # Needed for the snapshot backup described in the README.
      - --web.enable-admin-api
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus
    ports:
      # Loopback only, the admin API is enabled.
      #   ssh -N -L 9090:127.0.0.1:9090 homeserver
      - "127.0.0.1:9090:9090"
    networks:
      - dash

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: armdash-node-exporter
    restart: unless-stopped
    pid: host
    command:
      - --path.rootfs=/host
      - --collector.hwmon
    volumes:
      - /:/host:ro,rslave
    networks:
      - dash

networks:
  dash:
    driver: bridge
